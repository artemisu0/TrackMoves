<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чей ход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDE6D6; --ink:#1F1B16; --muted:#6B6254; --card:#F8F4EA; --line:#D6CCB6;
  --p1:#C8352B; --p2:#1F5FB4; --p3:#E2A614; --p4:#2E8B4A; --p5:#7A3FA8; --p6:#E06A1B; --p7:#1D8C8C; --p8:#3A3A3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1C1915; --ink:#F1EADB; --muted:#A89E8C; --card:#26221C; --line:#3A342B; }
}
:root[data-theme="dark"]{ --bg:#1C1915; --ink:#F1EADB; --muted:#A89E8C; --card:#26221C; --line:#3A342B; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- setup ---------- */
#setup{max-width:520px;margin:0 auto;padding:28px 20px 40px}
h1{font-family:"Unbounded",system-ui,sans-serif;font-weight:800;font-size:2.2rem;line-height:1.05;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px;line-height:1.45}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 10px}
.pawn{width:22px;height:28px;flex:none;position:relative}
.pawn::before{content:"";position:absolute;left:5px;top:0;width:12px;height:12px;border-radius:50%;background:var(--c)}
.pawn::after{content:"";position:absolute;left:1px;bottom:0;width:20px;height:16px;border-radius:10px 10px 4px 4px;background:var(--c)}
.row input{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;padding:10px 4px;color:var(--ink)}
.row input::placeholder{color:var(--muted)}
.ico{border:0;background:transparent;width:38px;height:38px;border-radius:10px;font-size:1.1rem;color:var(--muted)}
.ico:hover{background:var(--line);color:var(--ink)}
.ico:disabled{opacity:.25;cursor:default;background:transparent}
.add{width:100%;border:2px dashed var(--line);background:transparent;border-radius:14px;padding:14px;color:var(--muted);font-weight:500}
.add:hover{border-color:var(--muted);color:var(--ink)}
.start{margin-top:24px;width:100%;border:0;border-radius:16px;padding:18px;background:var(--ink);color:var(--bg);font-family:"Unbounded",system-ui,sans-serif;font-weight:600;font-size:1.1rem}
.start:disabled{opacity:.35;cursor:default}
.hint{color:var(--muted);font-size:.9rem;margin-top:12px;text-align:center}

/* ---------- game ---------- */
#game{display:none;position:fixed;inset:0;flex-direction:column;background:var(--cur);color:#fff;transition:background .35s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#game.on{display:flex}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.chip{border:0;background:rgba(0,0,0,.22);color:#fff;border-radius:999px;padding:10px 16px;font-weight:600;font-size:.95rem}
.chip:hover{background:rgba(0,0,0,.35)}
.round{font-weight:500;opacity:.9}
.tap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;border:0;background:transparent;color:#fff;width:100%}
.now{font-size:1rem;opacity:.85;margin-bottom:10px}
.name{font-family:"Unbounded",system-ui,sans-serif;font-weight:800;font-size:clamp(2.6rem,14vw,7rem);line-height:1;letter-spacing:-.03em;word-break:break-word;max-width:100%}
.name.pop{animation:pop .3s ease}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:scale(1);opacity:1}}
.tapnote{margin-top:22px;opacity:.75;font-size:.95rem}
.queue{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 14px 18px}
.q{background:rgba(0,0,0,.22);border-radius:999px;padding:7px 12px;font-size:.9rem;display:flex;align-items:center;gap:7px;opacity:.7}
.q.cur{background:#fff;color:var(--ink);opacity:1;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
@media (prefers-reduced-motion: reduce){#game{transition:none}.name.pop{animation:none}}
</style>
</head>
<body>

<section id="setup">
  <h1>Чей ход</h1>
  <p class="sub">Впиши игроков по порядку хода. Первый в списке ходит первым.</p>
  <div class="list" id="list"></div>
  <button class="add" id="add">+ Добавить игрока</button>
  <button class="start" id="start">Начать игру</button>
  <p class="hint">Во время игры тапай в любом месте экрана, чтобы передать ход.</p>
</section>

<section id="game" aria-live="polite">
  <div class="bar">
    <button class="chip" id="back">← Назад</button>
    <span class="round" id="round">Круг 1</span>
    <button class="chip" id="edit">Игроки</button>
  </div>
  <button class="tap" id="tap" aria-label="Передать ход следующему игроку">
    <span class="now">Сейчас ходит</span>
    <span class="name" id="name"></span>
    <span class="tapnote">Тапни, когда ход закончен</span>
  </button>
  <div class="queue" id="queue"></div>
</section>

<script>
const COLORS=["--p1","--p2","--p3","--p4","--p5","--p6","--p7","--p8"];
let players=["",""], turn=0, round=1;

try{
  const s=JSON.parse(localStorage.getItem("cheyhod")||"null");
  if(s&&Array.isArray(s.players)&&s.players.length){players=s.players;turn=s.turn||0;round=s.round||1;}
}catch(e){}
function save(){try{localStorage.setItem("cheyhod",JSON.stringify({players,turn,round}))}catch(e){}}

const list=document.getElementById("list");
function color(i){return `var(${COLORS[i%COLORS.length]})`}
function names(){return players.map((p,i)=>p.trim()||`Игрок ${i+1}`)}

function renderSetup(){
  list.innerHTML="";
  players.forEach((p,i)=>{
    const r=document.createElement("div");r.className="row";
    r.innerHTML=`<span class="pawn" style="--c:${color(i)}"></span>
      <input maxlength="20" placeholder="Игрок ${i+1}" aria-label="Имя игрока ${i+1}">
      <button class="ico" data-a="up" aria-label="Выше" ${i===0?"disabled":""}>↑</button>
      <button class="ico" data-a="del" aria-label="Удалить" ${players.length<=2?"disabled":""}>✕</button>`;
    const inp=r.querySelector("input");inp.value=p;
    inp.addEventListener("input",()=>{players[i]=inp.value;save()});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const n=list.querySelectorAll("input")[i+1];n?n.focus():addPlayer()}});
    r.querySelector('[data-a="up"]').onclick=()=>{[players[i-1],players[i]]=[players[i],players[i-1]];save();renderSetup()};
    r.querySelector('[data-a="del"]').onclick=()=>{players.splice(i,1);save();renderSetup()};
    list.appendChild(r);
  });
  document.getElementById("add").disabled=players.length>=8;
}
function addPlayer(){if(players.length>=8)return;players.push("");save();renderSetup();const ins=list.querySelectorAll("input");ins[ins.length-1].focus()}
document.getElementById("add").onclick=addPlayer;

const game=document.getElementById("game"),nameEl=document.getElementById("name");
function renderGame(){
  const n=names();turn=((turn%n.length)+n.length)%n.length;
  game.style.setProperty("--cur",color(turn));
  nameEl.textContent=n[turn];
  nameEl.classList.remove("pop");void nameEl.offsetWidth;nameEl.classList.add("pop");
  document.getElementById("round").textContent=`Круг ${round}`;
  document.getElementById("queue").innerHTML=n.map((x,i)=>`<span class="q${i===turn?" cur":""}"><span class="dot" style="--c:${color(i)}"></span>${x.replace(/[<>&]/g,"")}</span>`).join("");
  document.getElementById("back").disabled=(round===1&&turn===0);
  save();
}
document.getElementById("start").onclick=()=>{turn=0;round=1;document.getElementById("setup").style.display="none";game.classList.add("on");renderGame()};
document.getElementById("tap").onclick=()=>{turn++;if(turn>=players.length){turn=0;round++}renderGame()};
document.getElementById("back").onclick=()=>{if(round===1&&turn===0)return;turn--;if(turn<0){turn=players.length-1;round--}renderGame()};
document.getElementById("edit").onclick=()=>{game.classList.remove("on");document.getElementById("setup").style.display="";renderSetup()};
document.addEventListener("keydown",e=>{if(!game.classList.contains("on"))return;if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();document.getElementById("tap").click()}if(e.key==="ArrowLeft")document.getElementById("back").click()});

renderSetup();
</script>
</body>
</html>
